<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terranova · Administración</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f7f2e8;background:#151713;--green:#92bd4d;--card:#22251f;--muted:#aeb6a5}
    *{box-sizing:border-box}body{margin:0}header{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #353a30}h1{margin:0;color:var(--green);font-size:1.5rem}h2{margin:0 0 24px}main{width:min(1200px,92%);margin:28px auto 80px}
    .login,.card{background:var(--card);border:1px solid #353a30;border-radius:14px;padding:28px;margin-bottom:18px}.login{max-width:460px;margin:80px auto}
    input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid #4b5145;background:#171a15;color:#fff;padding:12px 14px}input,textarea,select{display:block;width:100%;min-width:0}input,select{min-height:48px}textarea{min-height:120px;line-height:1.5;resize:vertical}
    input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}button{cursor:pointer;background:var(--green);border:0;color:#17200e;font-weight:700}.danger{background:#743b35;color:#fff}.ghost{background:#3a4035;color:#fff}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{outline:2px solid #d5ecac}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px}.login .grid{grid-template-columns:1fr}.grid .wide{grid-column:1/-1}.grid>button{justify-self:start;min-width:210px;margin-top:4px}
    label{display:flex;flex-direction:column;align-items:stretch;gap:9px;color:var(--muted);font-size:.9rem;font-weight:600}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid #3a4035}.row:first-child{border:0}.muted{color:var(--muted);font-size:.9rem}.actions{display:flex;gap:8px;align-items:center}.hidden{display:none}.notice{position:fixed;right:20px;bottom:20px;background:var(--green);color:#17200e;padding:12px 18px;border-radius:8px;font-weight:bold}
    .status-switch{position:relative;display:inline-flex;align-items:center;gap:9px;min-width:130px;background:transparent;color:var(--muted);padding:8px}.status-switch::before{content:"";width:38px;height:22px;border-radius:999px;background:#5b6255;box-shadow:inset 0 0 0 1px #737c6c;transition:.2s}.status-switch::after{content:"";position:absolute;width:16px;height:16px;left:11px;border-radius:50%;background:#fff;transition:.2s}.status-switch.active{color:#bfe77b}.status-switch.active::before{background:var(--green)}.status-switch.active::after{transform:translateX(16px)}
    .modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72)}.modal-backdrop.hidden{display:none}.modal{width:min(460px,100%);background:var(--card);border:1px solid #4b5145;border-radius:16px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.modal h2{margin-bottom:12px}.modal p{color:var(--muted);line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
    .schedule-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.schedule-options label{display:flex;flex-direction:row;align-items:center;gap:10px;padding:14px;border:1px solid #4b5145;border-radius:8px;background:#171a15;color:#fff;cursor:pointer}.schedule-options input{width:18px;height:18px;min-height:0;accent-color:var(--green)}
    @media(max-width:700px){header{align-items:flex-start;gap:12px;flex-direction:column}.card{padding:20px}.grid{grid-template-columns:1fr;gap:18px}.grid .wide{grid-column:auto}.grid>button{width:100%;min-width:0}.row{grid-template-columns:1fr}.actions{align-items:stretch}.actions button{flex:1}}
  </style>
</head>
<body>
<header><h1>Terranova · Panel</h1><span>Contenido del bot WAHA</span></header>
<main>
  <section id="login" class="login"><h2>Ingresar</h2><p class="muted">Usa la clave ADMIN_PASSWORD configurada en .env.</p><div class="grid"><input id="password" type="password" placeholder="Clave de administrador"><button onclick="login()">Entrar</button></div></section>
  <section id="app" class="hidden"><nav class="tabs" id="tabs"></nav><div id="content"></div></section>
</main><div id="notice" class="notice hidden"></div>
<div id="statusModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="statusModalTitle">
  <div class="modal">
    <h2 id="statusModalTitle">Confirmar cambio de estado</h2>
    <p id="statusModalText"></p>
    <div class="modal-actions"><button class="ghost" onclick="closeStatusModal()">Cancelar</button><button id="confirmStatusButton" onclick="confirmStatusChange()">Confirmar</button></div>
  </div>
</div>
<script>
let password=sessionStorage.adminPassword||'', data={}, current='settings', pendingStatusChange=null;
const definitions={
 settings:{title:'Datos del negocio',fields:[['business_name','Nombre'],['address','Dirección'],['address_reference','Referencia'],['phone','Teléfono'],['card_url','URL de carta digital']]},
 schedules:{title:'Horarios',fields:[['name','Nombre'],['days','Días (0=dom, 1=lun...)'],['start_time','Inicio','time'],['end_time','Fin','time'],['sort_order','Orden','number']]},
 categories:{title:'Categorías',fields:[['schedule_ids','Turnos en los que aparece','schedules'],['name','Nombre'],['emoji','Emoji'],['description','Descripción'],['sort_order','Orden','number']]},
 products:{title:'Productos y precios',fields:[['category_id','Categoría','category'],['name','Producto'],['description','Detalle'],['price','Precio','number'],['sort_order','Orden','number']]},
 promotions:{title:'Promociones dinámicas',fields:[['title','Título'],['description','Detalle'],['price_text','Precio/texto'],['days','Días (0=dom, 1=lun...)'],['specific_date','Fecha específica (opcional)','date'],['start_time','Inicio','time'],['end_time','Fin','time'],['priority','Prioridad','number']]}
};
async function api(url,options={}){const response=await fetch('/api/admin'+url,{...options,headers:{'Content-Type':'application/json','x-admin-password':password,...options.headers}});if(!response.ok)throw new Error((await response.json()).error||'Error');return response.json()}
async function login(){password=document.querySelector('#password').value;try{await load();sessionStorage.adminPassword=password}catch(e){alert(e.message)}}
async function load(){data=await api('/data');document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');renderTabs();render()}
function renderTabs(){tabs.innerHTML=Object.entries(definitions).map(([key,d])=>`<button class="ghost ${key===current?'active':''}" onclick="current='${key}';renderTabs();render()">${d.title}</button>`).join('')}
function fieldHtml([key,label,type='text'],value=''){const wide=['address','address_reference','card_url','description','price_text'].includes(key)||type==='schedules'?'wide':'',numberOptions=type==='number'?(key==='price'?'step="0.01" min="0" inputmode="decimal"':'step="1" inputmode="numeric"'):'';if(type==='category')return `<label class="${wide}">${label}<select name="${key}" required>${data.categories.map(c=>`<option value="${c.id}" ${String(c.id)===String(value)?'selected':''}>${c.emoji} ${c.name}</option>`).join('')}</select></label>`;if(type==='schedules'){const selected=Array.isArray(value)?value.map(String):[];return `<div class="wide"><label>${label}</label><div class="schedule-options">${data.schedules.filter(s=>s.active).map(s=>`<label><input type="checkbox" name="${key}" value="${s.id}" ${selected.includes(String(s.id))?'checked':''}>${s.name}<span class="muted">${s.start_time}–${s.end_time}</span></label>`).join('')}</div></div>`}const tag=key.includes('description')||key.includes('reference')?'textarea':'input';return `<label class="${wide}">${label}<${tag} name="${key}" ${tag==='input'?`type="${type}" ${numberOptions}`:''} value="${tag==='input'?(value??''):''}">${tag==='textarea'?(value??''):''}</${tag}></label>`}
function render(){const d=definitions[current];if(current==='settings'){content.innerHTML=`<div class="card"><h2>${d.title}</h2><form onsubmit="saveSettings(event)" class="grid">${d.fields.map(f=>fieldHtml(f,data.settings[f[0]])).join('')}<button>Guardar cambios</button></form></div>`;return}content.innerHTML=`<div class="card"><h2>Nueva entrada</h2><form onsubmit="createItem(event)" class="grid">${d.fields.map(f=>fieldHtml(f)).join('')}<button>Agregar</button></form></div><div class="card"><h2>${d.title}</h2>${data[current].map(rowHtml).join('')||'<p class="muted">No hay registros.</p>'}</div>`}
function rowHtml(row){const d=definitions[current],title=current==='categories'?`${row.emoji||'🍽️'} ${row.name}`:(row.title||row.name),scheduleNames=current==='categories'?(row.schedule_ids||[]).map(id=>data.schedules.find(s=>s.id===id)?.name).filter(Boolean):[],order=current==='categories'?`Turnos: ${scheduleNames.join(', ')||'sin asignar'} · Orden: ${row.sort_order||'sin definir'}`:'',hasStatus=['products','categories'].includes(current),status=hasStatus?`<button type="button" class="status-switch ${row.active?'active':''}" role="switch" aria-checked="${Boolean(row.active)}" onclick="askStatusChange('${current}',${row.id})">${row.active?'Activo':'Inactivo'}</button>`:'';return `<div class="row"><div><strong>${title}</strong><div class="muted">${order}${order&&row.description?' · ':''}${row.description||''}${row.price!==undefined?` · S/ ${Number(row.price).toFixed(2)}`:''}${row.start_time?` · ${row.start_time}–${row.end_time}`:''}</div></div><div class="actions">${status}<button class="ghost" onclick='editItem(${JSON.stringify(row)})'>Editar</button><button class="danger" onclick="removeItem(${row.id})">Eliminar</button></div></div>`}
function formObject(form){const formData=new FormData(form),result=Object.fromEntries(formData.entries());if(form.querySelector('[name="schedule_ids"]'))result.schedule_ids=formData.getAll('schedule_ids');return result}
async function saveSettings(e){e.preventDefault();await api('/settings',{method:'PUT',body:JSON.stringify(formObject(e.target))});flash();await load()}
async function createItem(e){e.preventDefault();await api('/'+current,{method:'POST',body:JSON.stringify({...formObject(e.target),active:1})});flash();await load()}
async function editItem(row){const d=definitions[current], box=document.createElement('div');box.className='card';box.innerHTML=`<h2>Editar</h2><form class="grid">${d.fields.map(f=>fieldHtml(f,row[f[0]])).join('')}<label>Visible<select name="active"><option value="1" ${row.active?'selected':''}>Sí</option><option value="0" ${!row.active?'selected':''}>No</option></select></label><button>Guardar</button><button type="button" class="ghost">Cancelar</button></form>`;content.prepend(box);box.querySelector('.ghost').onclick=()=>box.remove();box.querySelector('form').onsubmit=async e=>{e.preventDefault();await api('/'+current+'/'+row.id,{method:'PUT',body:JSON.stringify(formObject(e.target))});flash();await load()}}
async function removeItem(id){if(!confirm('¿Eliminar este registro?'))return;await api('/'+current+'/'+id,{method:'DELETE'});flash();await load()}
function askStatusChange(resource,id){const item=data[resource]?.find(row=>row.id===id);if(!item)return;const isCategory=resource==='categories',kind=isCategory?'la categoría':'el producto',effect=isCategory?'La categoría y sus productos':'El producto';pendingStatusChange={resource,id:item.id,name:item.name,active:Boolean(item.active)};const action=item.active?'desactivar':'activar';statusModalText.textContent=`¿Deseas ${action} ${kind} “${item.name}”? ${item.active?`${effect} dejarán de mostrarse en el menú de WhatsApp.`:`${effect} volverán a mostrarse en el menú de WhatsApp.`}`;confirmStatusButton.textContent=item.active?'Desactivar':'Activar';confirmStatusButton.className=item.active?'danger':'';statusModal.classList.remove('hidden')}
function closeStatusModal(){statusModal.classList.add('hidden');pendingStatusChange=null}
async function confirmStatusChange(){if(!pendingStatusChange)return;confirmStatusButton.disabled=true;try{await api('/'+pendingStatusChange.resource+'/'+pendingStatusChange.id,{method:'PUT',body:JSON.stringify({active:pendingStatusChange.active?0:1})});closeStatusModal();flash();await load()}finally{confirmStatusButton.disabled=false}}
function flash(){notice.textContent='Cambios guardados';notice.classList.remove('hidden');setTimeout(()=>notice.classList.add('hidden'),1800)}
if(password)load().catch(()=>sessionStorage.removeItem('adminPassword'));
</script></body></html>
